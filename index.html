      for (let i = 0; i < 3; i++) for (let j = 0; j < 2; j++) R(x + 5 + i * 3, y + 10 + j * 2, 2, 1, '#666'); break;
    case '~': { // Brunnen: Steinbecken, Wasser, Fontäne + Statue in der Mitte
      R(x, y + 3, 16, 13, '#2c5aa8'); R(x, y + 3, 16, 1, '#8ac0f0'); const ph = ((state.t >> 3) + cx) % 4; R(x + ph * 4, y + 6, 4, 1, '#a0d0ff'); R(x + ((ph + 2) % 4) * 4, y + 10, 3, 1, '#7ab0e8');
      R(x, y, 16, 3, '#9a9a94'); R(x, y, 16, 1, '#c8c8c0'); // Beckenrand
      const left = tileAt(x + state.cam - 1, y) !== '~', right = tileAt(x + state.cam + 16, y) !== '~';
      if (left) R(x, y - 6, 3, 9, '#8a8a84'); if (right) R(x + 13, y - 6, 3, 9, '#8a8a84'); // Steinpfosten außen
      if (!left && !right) { const h = 22 + ((state.t >> 2) % 3); R(x + 7, y - h, 2, h, '#bfe0ff'); R(x + 5, y - h - 2, 6, 2, '#e8f4ff'); R(x + 4, y - 8, 8, 5, '#7a7a74'); R(x + 3, y - 10, 4, 3, '#7a7a74'); R(x + 1, y - 7, 2, 4, '#7a7a74'); }
      break; }
    case 'D': // Schreibtisch
      R(x, y + 3, 16, 3, '#c8a878'); R(x, y + 3, 16, 1, '#e0c090'); R(x + 1, y + 6, 3, 10, '#a08050'); R(x + 12, y + 6, 3, 10, '#a08050'); R(x + 5, y + 7, 6, 5, '#b09060'); R(x + 7, y + 9, 2, 1, '#333'); break;
    case 'P': // Drucker
      R(x + 1, y + 6, 14, 9, '#d8d8d0'); R(x + 2, y + 4, 12, 3, '#c0c0b8'); R(x + 4, y + 2, 8, 2, '#fff'); R(x + 3, y + 8, 10, 1, '#333'); R(x + 12, y + 10, 2, 2, (state.t >> 4) & 1 ? '#40e040' : '#e04040'); R(x + 1, y + 15, 14, 1, '#888'); break;
    case 'A': // Aktenschrank
      R(x, y, 16, 16, '#9aa0a8'); R(x, y, 16, 1, '#c0c6cc'); R(x + 1, y + 2, 14, 6, '#8a9098'); R(x + 1, y + 9, 14, 6, '#8a9098'); R(x + 6, y + 4, 4, 1, '#333'); R(x + 6, y + 11, 4, 1, '#333'); break;
    case '-': // Galerie-Sims (Marmor, Goldkante) / Regalbrett im Büro
      if (LV && LV.bg === 'office' && state.mode !== 'title') { R(x, y + 4, 16, 4, '#b0a890'); R(x, y + 4, 16, 1, '#d8d0b8'); R(x, y + 8, 16, 1, '#7a7460'); R(x + 1, y, 3, 4, '#5a6a80'); R(x + 5, y + 1, 4, 3, '#d04040'); R(x + 10, y, 5, 4, '#e0d8c0'); break; }
      R(x, y + 4, 16, 5, '#ece4d4'); R(x, y + 4, 16, 1, '#d8b040'); R(x, y + 8, 16, 1, '#b8ae9e'); R(x + 2, y, 1, 4, '#d8b040'); R(x + 9, y, 1, 4, '#d8b040'); R(x, y, 16, 1, '#d8b040'); break;
    case '|': if (state.bossActive || state.bossDone) { R(x + 6, y, 4, 16, '#8a2a2a'); R(x + 7, y, 2, 16, '#c04040'); } break; // Samtkordel
  }
}
function drawOffice() {
  R(0, 0, W, H, '#dfe4ea'); R(0, 0, W, 14, '#c8ced6'); R(0, 14, W, 2, '#b0b8c2'); R(0, FLOOR * TILE - 4, W, 4, '#5a6a84');
  const off = -(state.cam * 0.5) % 120;
  for (let x = off - 120; x < W + 120; x += 120) {
    R(x + 10, 30, 56, 60, '#8ab8e0'); R(x + 10, 30, 56, 2, '#fff'); R(x + 37, 30, 2, 60, '#fff'); R(x + 10, 58, 56, 2, '#fff'); R(x + 8, 28, 60, 2, '#fff'); R(x + 8, 90, 60, 3, '#f0f0f0'); // Fenster
    R(x + 14, 34, 20, 8, '#c8e0f4'); // Wolke
    R(x + 80, 4, 28, 4, '#fff8e0'); // Deckenleuchte
    R(x + 78, 120, 34, 4, '#b8b8c0'); R(x + 80, 124, 3, 36, '#9a9aa4'); R(x + 106, 124, 3, 36, '#9a9aa4'); R(x + 88, 106, 14, 12, '#2a2a30'); R(x + 89, 107, 12, 10, '#3a78d8'); // Schreibtisch hinten
  }
  if (state.mode !== 'title' && state.cam < 300) { ctx.fillStyle = '#5a6a84'; ctx.font = 'bold 10px monospace'; ctx.textAlign = 'left'; ctx.fillText('4. ETAGE', 60 - state.cam * 0.5, 50); }
  const ex = EXIT_X * TILE - state.cam; // Tür IT-Lager
  if (ex > -40 && ex < W) {
    R(ex, 104, 32, 56, '#7a7a84'); R(ex + 2, 106, 28, 54, '#9a9aa8'); R(ex + 24, 132, 3, 3, '#333');
    R(ex + 3, 92, 26, 10, '#fff'); text(T().exitDoor, ex + 16, 100, 6, '#222'); R(ex + 12, 112, 8, 6, '#c0e0ff');
  }
}
function drawBackground() {
  if (LV && LV.bg === 'office' && state.mode !== 'title') return drawOffice();
  R(0, 0, W, H, '#e8dcc4'); R(0, 0, W, 24, '#d8c8a8'); R(0, 24, W, 2, '#d8b040'); R(0, FLOOR * TILE - 6, W, 6, '#c8b890');
  // Säulen + Kronleuchter (Parallax 0.5)
  const off = -(state.cam * 0.5) % 96;
  for (let x = off - 96; x < W + 96; x += 96) {
    R(x + 8, 20, 12, 140, '#f4ecdc'); R(x + 8, 20, 2, 140, '#fff'); R(x + 18, 20, 2, 140, '#c8b890'); R(x + 4, 18, 20, 6, '#d8b040'); R(x + 4, 154, 20, 6, '#d8b040');
    const cx = x + 56; R(cx - 1, 0, 2, 14, '#8a7a40'); R(cx - 10, 14, 20, 3, '#d8b040'); R(cx - 7, 17, 14, 4, '#f0d060');
    for (let i = 0; i < 5; i++) R(cx - 9 + i * 4, 21 + (i % 2), 2, 3 + (i % 2), (state.t + i * 7) % 20 < 10 ? '#fff8c0' : '#f0d060');
  }
  if (state.mode !== 'title' && state.cam < 300) { ctx.fillStyle = '#b89030'; ctx.font = 'bold 10px monospace'; ctx.textAlign = 'left'; ctx.fillText('GRAND HOTEL', 60 - state.cam * 0.5, 50); }
  // Aufzug am Ende
  const ex = EXIT_X * TILE - state.cam;
  if (ex > -40 && ex < W) {
    R(ex, 104, 32, 56, '#b89030'); R(ex + 2, 106, 28, 54, '#d8b040'); R(ex + 15, 106, 2, 54, '#8a6a20');
    if (state.bossDone) R(ex + 6, 106, 20, 54, '#fff8e0');
    R(ex + 10, 96, 12, 6, '#333'); R(ex + 12, 98, 3, 2, state.bossDone ? '#40e040' : '#e04040');
  }
}
// frame-Index: Spieler idle/lauf/sprung, Gegner idle/lauf/meckern. Hitbox-Mitte = Sprite-Mitte, Füße auf Hitbox-Boden.
function drawSprite(key, en, frame, flipY) {
  const s = SPR[key]; if (!s.img.complete) return;
  const cx = en.x + en.ox + en.w / 2, bottom = en.y + en.h;
  const flip = en.dir !== s.face;
  ctx.save(); ctx.translate(Math.round(cx), Math.round(bottom)); ctx.scale(flip ? -1 : 1, flipY ? -1 : 1);
  ctx.drawImage(s.img, frame * s.fw, 0, s.fw, s.fh, -s.fw / RS / 2, -s.fh / RS, s.fw / RS, s.fh / RS); ctx.restore();
}
const walkFrame = en => 1 + ((en.anim >> 3) & 1);
function bubble(txt, x, y) {
  ctx.font = '7px monospace'; ctx.textAlign = 'left';
  const w = ctx.measureText(txt).width + 6; x = Math.max(2, Math.min(x - w / 2, W - w - 2));
  R(x, y - 12, w, 11, '#fff'); R(x + 1, y - 13, w - 2, 13, '#fff'); R(x + w / 2 - 2, y - 1, 4, 2, '#fff');
  ctx.fillStyle = '#111'; ctx.fillText(txt, x + 3, y - 4);
}
function text(s, x, y, size = 8, col = '#fff', align = 'center') {
  ctx.font = `bold ${size}px monospace`; ctx.textAlign = align;
  ctx.fillStyle = '#000'; ctx.fillText(s, x + 1, y + 1); ctx.fillStyle = col; ctx.fillText(s, x, y); ctx.textAlign = 'left';
}

function drawHS(x, y, n = 7) {
  const hs = (hsCache || loadHS()).slice(0, n); if (!hs.length) return;
  R(x - 4, y - 9, 124, 8 + hs.length * 8, 'rgba(0,0,0,.55)'); text(T().best, x, y, 7, '#d8b040', 'left');
  hs.forEach((h, i) => text(`${i + 1}. ${h.name.padEnd(12)} ${String(h.score).padStart(6)} ${fmtTime(h.time * 60)}${h.win ? '' : '†'}`, x, y + 9 + i * 8, 6, i === 0 ? '#f8e060' : '#fff', 'left'));
}
function render() {
  ctx.setTransform(RS, 0, 0, RS, 0, 0);
  ctx.save();
  if (state.shake) ctx.translate((Math.random() - .5) * 4, (Math.random() - .5) * 4);
  drawBackground();
  if (state.mode === 'title') {
    for (let x = 0; x < W; x += 16) drawTile('#', x, FLOOR * TILE, x / 16);
    ctx.save(); ctx.translate(W / 2, FLOOR * TILE); ctx.scale(2 / RS, 2 / RS); ctx.drawImage(SPR.azubi.img, 0, 0, SPR.azubi.fw, SPR.azubi.fh, -SPR.azubi.fw / 2, -SPR.azubi.fh, SPR.azubi.fw, SPR.azubi.fh); ctx.restore();
    text(T().title, W / 2, 44, 16, '#d8b040'); text(T().sub, W / 2, 60, 8);
    if (state.t % 60 < 40) text(T().press, W / 2, 150, 8);
    text(T().lang, W / 2, 170, 6, '#555'); drawHS(196, 92, 5); ctx.restore(); return;
  }
  const c0 = Math.floor(state.cam / TILE), c1 = c0 + W / TILE + 1;
  for (let cy = 0; cy < ROWS; cy++) for (let cx = c0; cx <= c1 && cx < LEVEL_W; cx++) { const t = map[cy][cx]; if (t !== '.') drawTile(t, cx * TILE - state.cam, cy * TILE, cx); }
  for (const p of pickups) {
    const x = p.x - state.cam, y = p.y + Math.sin(state.t / 10 + p.x) * 1.5;
    if (p.t === 'o') { R(x, y + 2, 7, 6, '#fff'); R(x + 1, y + 2, 5, 1, '#5a3a22'); R(x + 7, y + 3, 2, 3, '#fff'); if (state.t % 30 < 15) R(x + 2, y - 1, 1, 2, '#ccc'); }
    else { R(x - 1, y + 1, 11, 7, '#5a2e12'); R(x, y + 2, 9, 5, '#7a4218'); R(x + 3, y + 2, 1, 5, '#5a2e12'); R(x + 6, y + 2, 1, 5, '#5a2e12'); R(x - 1, y + 1, 2, 7, '#d8b040'); R(x + 9, y + 1, 1, 7, '#d8b040'); } // Schokoriegel
  }
  for (const en of enemies.filter(e => e.t === 'g')) { // Statisten zuerst = hinter allem
    if (Math.abs(en.x - state.cam - W / 2) > W) continue;
    ctx.globalAlpha = 0.75; drawSprite(en.spr, { ...en, x: en.x - state.cam }, 0); ctx.globalAlpha = 1;
    if (en.bubbleT > 0) bubble(en.bubble, en.x - state.cam + 7, en.y - 2);
  }
  for (const en of enemies) {
    if (en.t === 'g' || Math.abs(en.x - state.cam - W / 2) > W) continue;
    if (!en.alive) { if (en.deadT < 25) drawSprite(en.spr, { ...en, x: en.x - state.cam, y: en.y + en.h }, 0, true); continue; } // kurz kopfüber
    drawSprite(en.spr, { ...en, x: en.x - state.cam }, en.bubbleT > 0 ? 3 : walkFrame(en));
    if (en.bubbleT > 0) bubble(en.bubble, en.x - state.cam + 7, en.y - 2);
  }
  if (state.bossActive && boss.alive) {
    if (!(boss.inv > 0 && (state.t & 2))) drawSprite('boss', { ...boss, x: boss.x - state.cam }, boss.callT > 270 ? 3 : boss.bubbleT > 0 ? 0 : walkFrame(boss));
    if (boss.bubbleT > 0 && boss.alive) bubble(boss.bubble, boss.x - state.cam + 15, boss.y - 2);
    if (boss.alive && boss.callT < 40 && (state.t & 4)) text('☎', boss.x - state.cam + 40, boss.y + 4, 10, '#e04040');
    if (boss.confused) for (let i = 0; i < 3; i++) { const a = state.t / 12 + i * 2.1; text('✦', boss.x - state.cam + 15 + Math.cos(a) * 14, boss.y - 2 + Math.sin(a) * 4, 8, '#f8e060'); }
  }
  for (const s of shots) { ctx.save(); ctx.translate(s.x - state.cam, s.y); ctx.rotate(s.r); R(-3, -3, 7, 7, '#f8e060'); R(-2, -1, 4, 1, '#888'); ctx.restore(); }
  if (player.asleep && state.mode === 'play') {
    const sp = SPR.azubi, fx = player.x - state.cam + 7, fy = player.y + player.h;
    ctx.save(); ctx.translate(Math.round(fx), Math.round(fy)); ctx.rotate(-Math.PI / 2); ctx.scale(player.dir, 1);
    ctx.drawImage(sp.img, 0, 0, sp.fw, sp.fh, 0, -sp.fh / RS / 2, sp.fw / RS, sp.fh / RS); ctx.restore(); // liegt auf dem Rücken, Kopf in Blickrichtung
    for (let i = 0; i < 3; i++) { const ph = ((player.idleT - 300) / 30 + i * 0.7) % 2.1; if (ph < 0) continue; text('z', fx - player.dir * 22 + Math.sin(ph * 3) * 3, fy - 14 - ph * 12, 5 + ph * 2, '#5a6a84'); }
  } else if (!(player.inv > 0 && (state.t & 2)) && state.mode !== 'dead') drawSprite('azubi', { ...player, x: player.x - state.cam }, !player.ground ? 5 : player.vx ? 1 + ((player.anim >> 2) & 3) : 0);
  if (player.bubbleT > 0 && state.mode === 'play') bubble(player.bubble, player.x - state.cam + 7, player.y - 2);
  if (player.ringing > 0 && state.mode === 'play') { const px = player.x - state.cam + 7 + player.dir * 10 + (player.ringing & 2 ? 1 : -1), py = player.y + 6; R(px - 2, py - 4, 4, 7, '#222'); R(px - 1, py - 3, 2, 4, '#7ad'); text('))', px + 4, py + 1, 6, '#e04040'); if (player.bubbleT <= 0) bubble(player.ringText, px, py - 8); }
  for (const p of particles) R(p.x - state.cam, p.y, 2, 2, p.col);

  // HUD
  R(0, 0, W, 12, 'rgba(0,0,0,.55)');
  text(`${T().score} ${String(state.score).padStart(6, '0')}`, 4, 9, 7, '#fff', 'left');
  text(`${T().lives} ${'♥'.repeat(Math.max(0, state.lives))}`, W - 4, 9, 7, '#f06060', 'right');
  text(fmtTime(state.time), 120, 9, 7, '#fff', 'left');
  if (muted) text('M: AUS', 160, 9, 6, '#888', 'left');
  if (state.bossActive && boss.alive) { text(state.confuseCd > 0 ? '' : T().confuseHud, W / 2, 24, 7, state.t % 30 < 20 ? '#f8e060' : '#fff'); if (state.confuseCd > 0) R(W / 2 - 18, 21, 36 * (1 - state.confuseCd / 900), 2, '#f8e060');
    text(T().boss, W / 2, 9, 7, '#d8b040'); for (let i = 0; i < 5; i++) R(W / 2 - 24 + i * 10, 14, 8, 3, i < boss.hp ? '#e04040' : '#444'); }
  if (state.msgT > 0) { R(0, 60, W, 22, 'rgba(0,0,0,.6)'); text(state.bossActive ? T().bossHint : T()[LV.start], W / 2, 74, 8, '#fff'); }
  if (state.mode === 'dead') { R(0, 0, W, H, 'rgba(0,0,0,.6)'); text(T().gameover, W / 2, 60, 16, '#f06060'); text(`${T().score} ${state.score}   ${T().time} ${fmtTime(state.time)}`, W / 2, 78, 8); if (!nameForm.hidden) text(T().enterName, W / 2, 96, 8, '#f8e060'); else { drawHS(W / 2 - 60, 100); if (state.t > 60) text(T().retry, W / 2, 168, 8); } }
  if (state.mode === 'next') { R(0, 0, W, H, 'rgba(0,0,0,.7)'); text(T().nextLevel, W / 2, 76, 16, '#d8b040'); text(T().levels[state.level + 1], W / 2, 98, 9); }
  if (state.mode === 'win') { R(0, 0, W, H, 'rgba(0,0,0,.6)'); text(T().win, W / 2, 50, 16, '#d8b040'); text(T().winsub, W / 2, 66, 8); text(`${T().time} ${fmtTime(state.time)}   ${T().timeBonus} +${state.bonus}`, W / 2, 80, 7); text(`${T().score} ${state.score}`, W / 2, 94, 8, '#f8e060'); if (!nameForm.hidden) text(T().enterName, W / 2, 110, 8, '#f8e060'); else { drawHS(W / 2 - 60, 108); if (state.t > 120) text(T().retry, W / 2, 168, 8); } }
  ctx.restore();
}

// ───────────────────────── Loop & Resize ─────────────────────────
function fit() { const s = Math.max(1, Math.floor(Math.min(innerWidth / W, innerHeight / H))); cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px'; }
addEventListener('resize', fit); fit();
let acc = 0, last = performance.now();
function loop(now) {
  acc += Math.min(now - last, 100); last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; } // fester Zeitschritt, unabhängig von Bildrate
  render(); requestAnimationFrame(loop);
}
resetState(); requestAnimationFrame(loop);
</script>
