let map, enemies, pickups, boss, shots = [], particles = [], state;
function buildLevel() {

  for (let x = 0; x < LEVEL_W; x++) map[FLOOR][x] = '#';
  enemies = []; pickups = [];

function mkEnemy(t, cx, cy) {

  const spr = big ? 'boss' : ENEMY_TYPES[t][Math.floor(Math.random() * ENEMY_TYPES[t].length)];

const GRAV = 0.25, JUMP = -5.3, SPEED = 1.7;
// ponytail: AABB-gegen-Tiles, achsenweise. Reicht für 16px-Tiles; Swept-Collision erst bei vy > 16.
function moveBody(b) {
  b.x += b.vx;
  const l = b.x + b.ox, r = l + b.w - 1;
  for (const py of [b.y, b.y + b.h / 2, b.y + b.h - 1]) {
    if (b.vx > 0 && isSolid(r, py)) { b.x = Math.floor(r / TILE) * TILE - b.w - b.ox; b.hitWall = true; }
    if (b.vx < 0 && isSolid(l, py)) { b.x = (Math.floor(l / TILE) + 1) * TILE - b.ox; b.hitWall = true; }
  }
  b.vy = Math.min(b.vy + GRAV, 6); b.y += b.vy; b.ground = false;
  const l2 = b.x + b.ox + 1, r2 = b.x + b.ox + b.w - 2;
  for (const px of [l2, r2]) {
    if (b.vy > 0 && isSolid(px, b.y + b.h)) { b.y = Math.floor((b.y + b.h) / TILE) * TILE - b.h; b.vy = 0; b.ground = true; }
    if (b.vy < 0 && isSolid(px, b.y)) { b.y = (Math.floor(b.y / TILE) + 1) * TILE; b.vy = 0; }
  }
}

let AC;
function beep(f, dur, type = 'square', vol = 0.08, slide = 0) {
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = f; if (slide) o.frequency.linearRampToValueAtTime(f + slide, AC.currentTime + dur);
  g.gain.value = vol; g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + dur);
  o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime + dur);
}
const SFX = {
  jump: () => beep(300, 0.15, 'square', 0.06, 300),
  coin: () => { beep(900, 0.08, 'square', 0.05); setTimeout(() => beep(1300, 0.15, 'square', 0.05), 60); },
  stomp: () => beep(200, 0.12, 'triangle', 0.1, -150),
  hurt: () => beep(180, 0.35, 'sawtooth', 0.08, -120),
  life: () => [600, 800, 1000, 1300].forEach((f, i) => setTimeout(() => beep(f, 0.12), i * 80)),
  ring: () => [0, 150, 300].forEach(d => setTimeout(() => beep(1400, 0.1, 'square', 0.05), d)),
  bubble: () => beep(700, 0.05, 'square', 0.03),
  die: () => [400, 300, 200, 120].forEach((f, i) => setTimeout(() => beep(f, 0.2, 'triangle', 0.08), i * 150)),
  win: () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.18, 'square', 0.06), i * 130)),
  hit: () => beep(120, 0.3, 'sawtooth', 0.1, -60),
};

// ───────────────────────── Input ─────────────────────────
const keys = {};
let jumpPressed = false, startPressed = false;
function down(k) {
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if (!keys[k]) { if (k === 'jump') jumpPressed = true; startPressed = true; }
  keys[k] = true;
}
const KEYMAP = { ArrowLeft: 'left', a: 'left', ArrowRight: 'right', d: 'right', ArrowUp: 'jump', w: 'jump', ' ': 'jump' };
addEventListener('keydown', e => {
  const k = KEYMAP[e.key]; if (k) { e.preventDefault(); down(k); }
  if (e.key === 'Escape') resetState(); // ESC = zurück zum Titel
  if (e.key === 'l' && state.mode === 'title') { lang = lang === 'de' ? 'en' : 'de'; localStorage.setItem('lang', lang); }
});
addEventListener('keyup', e => { const k = KEYMAP[e.key]; if (k) keys[k] = false; });
for (const [id, k] of [['tl', 'left'], ['tr', 'right'], ['tj', 'jump']]) {
  const el = document.getElementById(id);
  el.addEventListener('pointerdown', e => { e.preventDefault(); down(k); });
  for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) el.addEventListener(ev, () => keys[k] = false);
}
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
cv.addEventListener('pointerdown', () => down('tap'));
cv.addEventListener('pointerup', () => keys.tap = false);

// ───────────────────────── Update ─────────────────────────
function say(en, lines) { en.bubble = lines[Math.floor(Math.random() * lines.length)]; en.bubbleT = 110; SFX.bubble(); }
function hurtPlayer() {
  if (player.inv > 0) return;
  state.lives--; player.inv = 120; player.vy = -3.5; state.shake = 8; SFX.hurt(); say(player, T().osamaHurt);
  if (state.lives <= 0) die();
}
function die() { state.mode = 'dead'; state.t = 0; SFX.die(); }
function puff(x, y, col, n = 6) { for (let i = 0; i < n; i++) particles.push({ x, y, vx: (Math.random() - .5) * 2, vy: -Math.random() * 2, t: 30, col }); }

function update() {
  state.t++;
  if (state.mode === 'title') { if (startPressed) { state.score = 0; state.lives = 3; startLevel(); } startPressed = false; return; }
  if (state.mode === 'dead') { if (state.t > 60 && startPressed) resetState(); startPressed = false; return; }
  if (state.mode === 'win') { if (state.t > 120 && startPressed) resetState(); startPressed = false; return; }
  startPressed = false;
  if (state.msgT > 0) state.msgT--;
  if (state.shake > 0) state.shake--;

  // Spieler
  player.vx = (keys.left ? -SPEED : 0) + (keys.right ? SPEED : 0);
  if (player.inv > 100) player.vx = -player.dir * 1.5; // Rückstoß nach Treffer
  else if (player.vx) player.dir = Math.sign(player.vx);
  if (jumpPressed && player.ground) { player.vy = JUMP; SFX.jump(); }
  if (!keys.jump && player.vy < -2) player.vy = -2; // kurzer Sprung bei frühem Loslassen
  jumpPressed = false;
  moveBody(player);
  if (player.inv > 0) player.inv--;
  if (player.bubbleT > 0) player.bubbleT--;
  if (player.vx && player.ground) player.anim++;
  if (player.y > H) return die();
  if (tileAt(player.x + 8, player.y + player.h - 2) === '~') return die(); // Brunnen = tödlich
  const minX = state.bossActive ? (BOSS_X - 1) * TILE : 0;
  player.x = Math.max(minX, Math.min(player.x, LEVEL_W * TILE - 16));

  // Pickups
  pickups = pickups.filter(p => {
    if (Math.abs(p.x - player.x - 8) < 10 && Math.abs(p.y - player.y - 11) < 14) {
      if (p.t === 'o') { state.score += 100; SFX.coin(); } else { state.lives++; state.score += 500; SFX.life(); }
      puff(p.x + 4, p.y + 4, '#d8b040'); return false;
    }
    return true;
  });

  for (const en of enemies) updateEnemy(en, en.t === 'g' ? T().guest : T().colleague);

  // Boss-Trigger
  if (!state.bossActive && !state.bossDone && player.x > (BOSS_X - 4) * TILE) {
    state.bossActive = true; state.msgT = 200; SFX.ring(); boss.callT = 60;
  }
  if (state.bossActive) updateBoss();
  shots = shots.filter(s => {
    s.vy += 0.12; s.x += s.vx; s.y += s.vy; s.r += 0.1;
    if (overlap(player, { x: s.x - 3, y: s.y - 3, w: 6, h: 6, ox: 0 })) { hurtPlayer(); return false; }
    return s.y < H;
  });
  particles = particles.filter(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.1; return --p.t > 0; });

  if (state.bossDone && player.x > EXIT_X * TILE) { state.mode = 'win'; state.t = 0; SFX.win(); }

  // Kamera – im Bosskampf fixiert
  const lock = (BOSS_X - 2) * TILE;
  state.cam = state.bossActive ? lock : Math.max(0, Math.min(player.x - W / 2 + 8, LEVEL_W * TILE - W));
}
function updateEnemy(en, lines) {
  if (!en.alive) { en.deadT++; return; }
  if (Math.abs(en.x - player.x) > W) return; // ponytail: nur Gegner in Bildschirmnähe ticken
  en.vx = en.dir * (en.t === 'g' ? 0.3 : 0.45); en.hitWall = false;
  const ahead = en.x + en.ox + (en.dir > 0 ? en.w + 1 : -1);
  if (en.ground && !isSolid(ahead, en.y + en.h + 1)) en.dir *= -1; // an Kanten umdrehen
  moveBody(en);
  if (en.hitWall) en.dir *= -1;
  en.anim++;
  if (--en.sayT <= 0) { say(en, lines); en.sayT = 150 + Math.random() * 150; }
  if (en.bubbleT > 0) en.bubbleT--;
  if (overlap(player, en)) {
    if (player.vy > 0 && player.y + player.h < en.y + en.h * 0.45) {
      en.alive = false; player.vy = -4; state.score += 200; SFX.stomp(); puff(en.x + 7, en.y + 16, '#fff'); say(player, T().osamaStomp);
    } else hurtPlayer();
  }
}
function updateBoss() {
  const b = boss;
  if (b.inv > 0) b.inv--;
  const speed = 0.5 + (3 - b.hp) * 0.25; // wird mit jedem Treffer hektischer
  b.dir = player.x < b.x ? -1 : 1; b.vx = b.dir * speed; b.hitWall = false;
  if (b.ground && Math.random() < 0.01) b.vy = -4.5;
  moveBody(b); b.anim++;
  if (b.bubbleT > 0) b.bubbleT--;
  // "alle 5 Minuten" = alle 5 Sekunden: Anruf + Post-it-Salve
  if (--b.callT <= 0) {
    b.callT = 300; say(b, T().bossLines); SFX.ring(); b.bubbleT = 90;
    for (let i = -1; i <= 1; i++) shots.push({ x: b.x + 15, y: b.y + 14, vx: b.dir * (1.2 + Math.abs(i) * 0.5) + i * 0.4, vy: -3.2 - Math.abs(i), r: 0 });
  }
  if (overlap(player, b)) {
    if (player.vy > 0 && player.y + player.h < b.y + b.h * 0.4 && b.inv === 0) {
      b.hp--; b.inv = 60; player.vy = -4.5; state.score += 1000; SFX.hit(); state.shake = 6; puff(b.x + 15, b.y, '#fff', 10);
      if (b.hp <= 0) { b.alive = false; state.bossDone = true; state.bossActive = false; state.score += 3000; puff(b.x + 15, b.y + 20, '#f8e060', 20); SFX.win(); }
    } else hurtPlayer();
  }
}

// ───────────────────────── Render ─────────────────────────
const R = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x | 0, y | 0, w, h); };
function drawTile(t, x, y, cx) {
  switch (t) {
    case '#': // Marmorboden
      R(x, y, 16, 16, '#d8d0c4'); R(x, y, 16, 2, '#f0eae0'); R(x, y + 2, 16, 1, '#b8ae9e');
      if (cx % 2) R(x + 3, y + 7, 6, 1, '#c4bcae'); else R(x + 8, y + 10, 5, 1, '#c4bcae'); break;
    case '=': // Rezeptionstresen
      R(x, y, 16, 16, '#5a3a22'); R(x, y, 16, 2, '#d8b040'); R(x, y + 2, 16, 1, '#3a2412'); R(x + 2, y + 6, 12, 6, '#6e4a2c'); break;
    case 'K': // Koffer
      R(x + 1, y + 5, 14, 11, '#7a4a2a'); R(x + 1, y + 5, 14, 1, '#9a6a3a'); R(x + 6, y + 2, 4, 3, '#3a2412'); R(x + 5, y + 3, 1, 2, '#3a2412'); R(x + 10, y + 3, 1, 2, '#3a2412');
      R(x + 3, y + 9, 2, 2, '#d8b040'); R(x + 11, y + 9, 2, 2, '#d8b040'); R(x + 1, y + 11, 14, 1, '#5a3a1a'); break;
    case 'W': // Gepäckwagen
      R(x + 1, y + 1, 2, 13, '#d8b040'); R(x + 13, y + 1, 2, 13, '#d8b040'); R(x + 1, y + 1, 14, 1, '#d8b040'); R(x + 3, y + 10, 10, 3, '#a02020');
      R(x + 2, y + 14, 3, 2, '#111'); R(x + 11, y + 14, 3, 2, '#111'); R(x + 4, y + 4, 8, 6, '#6a4a2a'); break;
    case 'C': // PC/Monitor
      R(x + 1, y + 2, 14, 10, '#2a2a30'); R(x + 2, y + 3, 12, 8, '#3a78d8'); R(x + 3, y + 4, 6, 1, '#a0d0ff'); R(x + 3, y + 6, 8, 1, '#a0d0ff'); R(x + 3, y + 8, 4, 1, '#a0d0ff');
      R(x + 7, y + 12, 2, 2, '#2a2a30'); R(x + 4, y + 14, 8, 2, '#2a2a30'); break;
    case 'N': // Netzwerkkabel-Knäuel
      R(x, y + 8, 16, 8, '#2050c0'); R(x + 2, y + 6, 12, 2, '#2050c0'); R(x + 1, y + 10, 4, 1, '#60a0ff'); R(x + 8, y + 12, 5, 1, '#60a0ff'); R(x + 5, y + 8, 3, 1, '#60a0ff');
      R(x + 12, y + 3, 3, 3, '#8ac'); R(x + 1, y + 4, 3, 3, '#8ac'); break;
    case 'S': // Switch
      R(x, y + 4, 16, 10, '#1a1a20'); R(x, y + 4, 16, 1, '#3a3a44');
      for (let i = 0; i < 6; i++) { R(x + 1 + i * 2.5, y + 7, 2, 1, (i + (state.t >> 3)) % 3 ? '#40e040' : '#206020'); R(x + 1 + i * 2.5, y + 10, 2, 2, '#444'); } break;
    case 'T': // Telefon
      R(x + 2, y + 8, 12, 7, '#e8e0d0'); R(x + 1, y + 4, 14, 3, '#2a2a30'); R(x + 1, y + 6, 2, 3, '#2a2a30'); R(x + 13, y + 6, 2, 3, '#2a2a30');
      for (let i = 0; i < 3; i++) for (let j = 0; j < 2; j++) R(x + 5 + i * 3, y + 10 + j * 2, 2, 1, '#666'); break;
    case '~': { // Elefantenbrunnen
      R(x, y, 16, 16, '#3a6ac0'); R(x, y + 2, 16, 1, '#8ac0f0'); const ph = ((state.t >> 3) + cx) % 4; R(x + ph * 4, y + 4, 4, 1, '#a0d0ff'); R(x, y, 16, 1, '#6a6a6a'); break; }
    case '|': if (state.bossActive || state.bossDone) { R(x + 6, y, 4, 16, '#8a2a2a'); R(x + 7, y, 2, 16, '#c04040'); } break; // Samtkordel
  }
}
function drawBackground() {
  R(0, 0, W, H, '#e8dcc4'); R(0, 0, W, 24, '#d8c8a8'); R(0, 24, W, 2, '#d8b040'); R(0, FLOOR * TILE - 6, W, 6, '#c8b890');
  // Säulen + Kronleuchter (Parallax 0.5)
  const off = -(state.cam * 0.5) % 96;
  for (let x = off - 96; x < W + 96; x += 96) {
    R(x + 8, 20, 12, 140, '#f4ecdc'); R(x + 8, 20, 2, 140, '#fff'); R(x + 18, 20, 2, 140, '#c8b890'); R(x + 4, 18, 20, 6, '#d8b040'); R(x + 4, 154, 20, 6, '#d8b040');
    const cx = x + 56; R(cx - 1, 0, 2, 14, '#8a7a40'); R(cx - 10, 14, 20, 3, '#d8b040'); R(cx - 7, 17, 14, 4, '#f0d060');
    for (let i = 0; i < 5; i++) R(cx - 9 + i * 4, 21 + (i % 2), 2, 3 + (i % 2), (state.t + i * 7) % 20 < 10 ? '#fff8c0' : '#f0d060');
  }
  if (state.mode !== 'title' && state.cam < 300) { ctx.fillStyle = '#b89030'; ctx.font = 'bold 10px monospace'; ctx.textAlign = 'left'; ctx.fillText('HOTEL ADLON', 60 - state.cam * 0.5, 50); }
  // Aufzug am Ende
  const ex = EXIT_X * TILE - state.cam;
  if (ex > -40 && ex < W) {
    R(ex, 104, 32, 56, '#b89030'); R(ex + 2, 106, 28, 54, '#d8b040'); R(ex + 15, 106, 2, 54, '#8a6a20');
    if (state.bossDone) R(ex + 6, 106, 20, 54, '#fff8e0');
    R(ex + 10, 96, 12, 6, '#333'); R(ex + 12, 98, 3, 2, state.bossDone ? '#40e040' : '#e04040');
  }
}
// frame-Index: Spieler idle/lauf/sprung, Gegner idle/lauf/meckern. Hitbox-Mitte = Sprite-Mitte, Füße auf Hitbox-Boden.
function drawSprite(key, en, frame, flipY) {
  const s = SPR[key]; if (!s.img.complete) return;
  const cx = en.x + en.ox + en.w / 2, bottom = en.y + en.h;
  const flip = en.dir !== s.face;
  ctx.save(); ctx.translate(Math.round(cx), Math.round(bottom)); ctx.scale(flip ? -1 : 1, flipY ? -1 : 1);
  ctx.drawImage(s.img, frame * s.fw, 0, s.fw, s.fh, -s.fw / 2, -s.fh, s.fw, s.fh); ctx.restore();
}
const walkFrame = en => 1 + ((en.anim >> 3) & 1);
function bubble(txt, x, y) {
  ctx.font = '7px monospace'; ctx.textAlign = 'left';
  const w = ctx.measureText(txt).width + 6; x = Math.max(2, Math.min(x - w / 2, W - w - 2));
  R(x, y - 12, w, 11, '#fff'); R(x + 1, y - 13, w - 2, 13, '#fff'); R(x + w / 2 - 2, y - 1, 4, 2, '#fff');
  ctx.fillStyle = '#111'; ctx.fillText(txt, x + 3, y - 4);
}
function text(s, x, y, size = 8, col = '#fff', align = 'center') {
  ctx.font = `bold ${size}px monospace`; ctx.textAlign = align;
  ctx.fillStyle = '#000'; ctx.fillText(s, x + 1, y + 1); ctx.fillStyle = col; ctx.fillText(s, x, y); ctx.textAlign = 'left';
}

function render() {
  ctx.save();
  if (state.shake) ctx.translate((Math.random() - .5) * 4, (Math.random() - .5) * 4);
  drawBackground();
  if (state.mode === 'title') {
    for (let x = 0; x < W; x += 16) drawTile('#', x, FLOOR * TILE, x / 16);
    ctx.save(); ctx.translate(W / 2, FLOOR * TILE); ctx.scale(2, 2); ctx.drawImage(SPR.osama.img, 0, 0, SPR.osama.fw, SPR.osama.fh, -SPR.osama.fw / 2, -SPR.osama.fh, SPR.osama.fw, SPR.osama.fh); ctx.restore();
    text(T().title, W / 2, 44, 16, '#d8b040'); text(T().sub, W / 2, 60, 8);
    if (state.t % 60 < 40) text(T().press, W / 2, 150, 8);
    text(T().lang, W / 2, 170, 6, '#555'); ctx.restore(); return;
  }
  const c0 = Math.floor(state.cam / TILE), c1 = c0 + W / TILE + 1;
  for (let cy = 0; cy < ROWS; cy++) for (let cx = c0; cx <= c1 && cx < LEVEL_W; cx++) { const t = map[cy][cx]; if (t !== '.') drawTile(t, cx * TILE - state.cam, cy * TILE, cx); }
  for (const p of pickups) {
    const x = p.x - state.cam, y = p.y + Math.sin(state.t / 10 + p.x) * 1.5;
    if (p.t === 'o') { R(x, y + 2, 7, 6, '#fff'); R(x + 1, y + 2, 5, 1, '#5a3a22'); R(x + 7, y + 3, 2, 3, '#fff'); if (state.t % 30 < 15) R(x + 2, y - 1, 1, 2, '#ccc'); }
    else { R(x - 1, y + 1, 10, 7, '#d8b040'); R(x, y + 2, 3, 2, '#333'); R(x + 5, y + 5, 4, 1, '#fff'); }
  }
  for (const en of enemies) {
    if (Math.abs(en.x - state.cam - W / 2) > W) continue;
    if (!en.alive) { if (en.deadT < 25) drawSprite(en.spr, { ...en, x: en.x - state.cam, y: en.y + en.h }, 0, true); continue; } // kurz kopfüber
    drawSprite(en.spr, { ...en, x: en.x - state.cam }, en.bubbleT > 0 ? 3 : walkFrame(en));
    if (en.bubbleT > 0) bubble(en.bubble, en.x - state.cam + 7, en.y - 2);
  }
  if (state.bossActive && boss.alive) {
    if (!(boss.inv > 0 && (state.t & 2))) drawSprite('boss', { ...boss, x: boss.x - state.cam }, boss.callT > 270 ? 3 : boss.bubbleT > 0 ? 0 : walkFrame(boss));
    if (boss.bubbleT > 0 && boss.alive) bubble(boss.bubble, boss.x - state.cam + 15, boss.y - 2);
    if (boss.alive && boss.callT < 40 && (state.t & 4)) text('☎', boss.x - state.cam + 40, boss.y + 4, 10, '#e04040');
  }
  for (const s of shots) { ctx.save(); ctx.translate(s.x - state.cam, s.y); ctx.rotate(s.r); R(-3, -3, 7, 7, '#f8e060'); R(-2, -1, 4, 1, '#888'); ctx.restore(); }
  if (!(player.inv > 0 && (state.t & 2)) && state.mode !== 'dead') drawSprite('osama', { ...player, x: player.x - state.cam }, !player.ground ? 5 : player.vx ? 1 + ((player.anim >> 2) & 3) : 0);
  if (player.bubbleT > 0 && state.mode === 'play') bubble(player.bubble, player.x - state.cam + 7, player.y - 2);
  for (const p of particles) R(p.x - state.cam, p.y, 2, 2, p.col);

  // HUD
  R(0, 0, W, 12, 'rgba(0,0,0,.55)');
  text(`${T().score} ${String(state.score).padStart(6, '0')}`, 4, 9, 7, '#fff', 'left');
  text(`${T().lives} ${'♥'.repeat(Math.max(0, state.lives))}`, W - 4, 9, 7, '#f06060', 'right');
  if (state.bossActive && boss.alive) { text(T().boss, W / 2, 9, 7, '#d8b040'); for (let i = 0; i < 3; i++) R(W / 2 - 18 + i * 12, 14, 10, 3, i < boss.hp ? '#e04040' : '#444'); }
  if (state.msgT > 0) { R(0, 60, W, 22, 'rgba(0,0,0,.6)'); text(state.bossActive ? T().bossHint : T().start, W / 2, 74, 8, '#fff'); }
  if (state.mode === 'dead') { R(0, 0, W, H, 'rgba(0,0,0,.6)'); text(T().gameover, W / 2, 80, 16, '#f06060'); if (state.t > 60) text(T().retry, W / 2, 110, 8); }
  if (state.mode === 'win') { R(0, 0, W, H, 'rgba(0,0,0,.6)'); text(T().win, W / 2, 76, 16, '#d8b040'); text(T().winsub, W / 2, 94, 8); text(`${T().score} ${state.score}`, W / 2, 112, 8); if (state.t > 120) text(T().retry, W / 2, 140, 8); }
  ctx.restore();
}

// ───────────────────────── Loop & Resize ─────────────────────────
function fit() { const s = Math.max(1, Math.floor(Math.min(innerWidth / W, innerHeight / H))); cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px'; }
addEventListener('resize', fit); fit();
let acc = 0, last = performance.now();
function loop(now) {
  acc += Math.min(now - last, 100); last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; } // fester Zeitschritt, unabhängig von Bildrate
  render(); requestAnimationFrame(loop);
}
resetState(); requestAnimationFrame(loop);
</script>
</body>
</html>
